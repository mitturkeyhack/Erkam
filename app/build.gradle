plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.mitturkeyhack.erkam'
    compileSdk 36

    defaultConfig {
        applicationId "com.mitturkeyhack.erkam"
        minSdk 26
        targetSdk 36
        versionCode runNo
        versionName "0.1." + runNo
    }

    buildFeatures { buildConfig true }

    // github: GitHub Releases'tan dağıtılan, kendini güncelleyen sürüm
    // play: Google Play'e yüklenen AAB; güncellemeyi Play yapar, kendi güncelleyicisi kapalı
    flavorDimensions "dagitim"
    productFlavors {
        github {
            dimension "dagitim"
            buildConfigField "boolean", "PLAY", "false"
        }
        play {
            dimension "dagitim"
            buildConfigField "boolean", "PLAY", "true"
        }
    }

    // İmza anahtarı depoda tutulmaz; derleme makinesi her seferinde geçici bir anahtar üretir
    // (bkz. .github/workflows/apk.yml). Kalıcı anahtar için depo sırlarına IMZA eklenebilir.
    signingConfigs {
        release {
            storeFile file(System.getenv("IMZA_DOSYA") ?: "imza.jks")
            storePassword System.getenv("IMZA_SIFRE") ?: ""
            storeType((System.getenv("IMZA_DOSYA") ?: "").endsWith(".p12") ? "pkcs12" : "jks")
            keyAlias "erkam"
            keyPassword System.getenv("IMZA_SIFRE") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Videoyu telefonun donanım kodlayıcısıyla sıkıştırmak için
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.core:core:1.13.1'
    // Anlık bildirim (google-services eklentisi olmadan, ayar sunucudan gelir)
    implementation 'com.google.firebase:firebase-messaging:24.0.3'
}
